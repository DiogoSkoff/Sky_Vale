<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyVale - Pagamento</title>
    <link rel="stylesheet" href="pagamento.css">
</head>
<body>
    <div class="tela">

        <div class="topo-pagamento">
            <a href="dadospassageiro.html" class="voltar">←</a>
            <div>
                <h2 class="pagamento-titulo">Pagamento</h2>
                <p class="pagamento-subtitulo">Escolha sua forma de pagamento</p>
            </div>
        </div>

        <div class="form-card">
            <h3 class="form-secao-titulo">Escolha sua forma de pagamento:</h3>

            <div class="metodo-lista">
                <a href="pagamento.html" class="metodo-item">
                    <span class="metodo-icone">💠</span>
                    <span class="metodo-label">Pix</span>
                    <span class="metodo-radio"></span>
                </a>

                <div class="metodo-item metodo-selecionado">
                    <span class="metodo-icone">💳</span>
                    <span class="metodo-label">Cartão de Crédito</span>
                    <span class="metodo-radio metodo-radio-ativo"></span>
                </div>
            </div>

            <p class="form-secao-titulo form-secao-titulo-cartao">Dados do cartão</p>

            <div class="campo">
                <label for="nome-cartao">Nome completo</label>
                <input type="text" id="nome-cartao" name="nome-cartao" placeholder="Digite seu nome">
            </div>

            <div class="campo">
                <label for="email-cartao">E-mail</label>
                <input type="email" id="email-cartao" name="email-cartao" placeholder="Digite seu e-mail">
            </div>

            <div class="campo-linha">
                <div class="campo">
                    <label for="validade">Data de validade</label>
                    <input type="text" id="validade" name="validade" placeholder="MM/AA">
                </div>
                <div class="campo">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="000">
                </div>
            </div>

            <div class="rodape-pagamento">
                <div>
                    <p class="preco-legenda">Total</p>
                    <span class="preco-total">R$ 5.800</span>
                </div>
            </div>

            <a href="confirmacao.html" class="btn-confirmar">Confirmar pagamento</a>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <div class="nav-icone img-placeholder">🏠</div>
                <span>Início</span>
            </a>
            <a href="aviao.html" class="nav-item">
                <div class="nav-icone img-placeholder">🔍</div>
                <span>Buscar</span>
            </a>
            <a href="explorar.html" class="nav-item">
                <div class="nav-icone img-placeholder">🧭</div>
                <span>Explorar</span>
            </a>
            <a href="favoritos.html" class="nav-item">
                <div class="nav-icone img-placeholder">❤</div>
                <span>Favoritos</span>
            </a>
            <a href="perfil.html" class="nav-item">
                <div class="nav-icone img-placeholder">👤</div>
                <span>Perfil</span>
            </a>
        </nav>

    </div>
</body>
</html>
